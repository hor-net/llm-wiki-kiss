[project]
name = "llm-wiki-kiss"
version = "0.3.0"
description = "Wiki KISS self-hosted per agenti AI con accesso MCP, CLI e REST."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Hornet SRL" }
]
keywords = ["ai", "knowledge-base", "llm", "mcp", "wiki"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.0.0,<3.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
]

[project.urls]
Homepage = "https://github.com/hor-net/llm-wiki-kiss"
Documentation = "https://github.com/hor-net/llm-wiki-kiss#readme"
Issues = "https://github.com/hor-net/llm-wiki-kiss/issues"
Repository = "https://github.com/hor-net/llm-wiki-kiss.git"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[project.scripts]
wiki-kiss-mcp = "mcp_server.server:main"
wiki-kiss = "wiki_core.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wiki_core", "mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
